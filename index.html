<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register your copy</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14202e;--mute:#5b6b7d;--line:#cfd7e1;--accent:#1f5fbf;--ok:#17714a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e8edf3;--mute:#97a6b7;--line:#2c3947;--accent:#6ea3f0;--ok:#4cc38a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{margin:0 0 6px;font-size:1.4rem}
p{margin:0 0 20px;color:var(--mute);line-height:1.5}
input{width:100%;padding:14px;font:600 1.05rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;text-align:center;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button,a.dl{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 1rem system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
@media (prefers-color-scheme:dark){button,a.dl{color:#0b1220}}
#msg{min-height:1.4em;margin-top:12px;font-size:.95rem}
.bad{color:var(--bad)}.ok{color:var(--ok)}
[hidden]{display:none!important}
</style>
</head>

  <h1>Register your copy</h1>
  <p>Enter the 25-character key you received.</p>
  <input id="key" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="29" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" aria-label="Registration key">
  <button id="go" type="button">Register</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <a id="dl" class="dl" href="YOUR_DOWNLOAD_LINK_HERE" download hidden>Download</a>
</main>

input.addEventListener('input',()=>{
  const raw=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,25);
  input.value=raw.match(/.{1,5}/g)?.join('-')||'';
  dl.hidden=true; msg.textContent='';
});
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function check(){
  const k=input.value;
  if(k.length!==29){msg.className='bad';msg.textContent='Keys have 25 characters in 5 groups of 5.';return;}
  if(HASHES.has(await sha256(k))){
    msg.className='ok';msg.textContent='Key accepted. Your download is ready.';dl.hidden=false;
  }else{
    msg.className='bad';msg.textContent='That key is not valid. Check it and try again.';dl.hidden=true;

}
